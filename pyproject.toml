[project]
name = "sokoban_speedrun"
version = "0.1.0"
description = "Sokoban Speedrun"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.0.0",
    "datasets>=2.19.0",
    "kernels==0.11.7",
    "modal>=1.1.0",
    "reasoning-gym==0.1.25",
    "safetensors>=0.4.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "vllm==0.22.0",
    "transformers>=4.57.3",
    "wandb>=0.17.0",
]

# torch/torchvision/torchaudio 2.11.0 resolve from the default PyPI index, which is the
# CUDA-13 build — matching vLLM 0.22.0's cu13 kernels (vLLM 0.22 ships only a cu13 wheel).
# A cu128 torch against vLLM's cu13 kernels silently disables vLLM's CUDA-graph/compiled
# fast path and tanks decode throughput ~30x, so we must keep the CUDA build matched.

# This repo is a set of standalone scripts (speedrun.py, modal_app.py), not an installable
# package: uv only manages the dependency environment, and the Modal image adds speedrun.py
# via add_local_python_source. So mark the project virtual (no build backend).
[tool.uv]
package = false
